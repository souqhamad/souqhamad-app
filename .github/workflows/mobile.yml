name: Native Mobile
on:
  push:
    branches: [main]
    paths: ['src/**', 'assets/**', 'plugins/**', 'scripts/**', 'tests/**', '*.json', '*.ts', '*.js', 'pnpm-lock.yaml', '.npmrc', 'codemagic.yaml', '.github/dependabot.yml', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['src/**', 'assets/**', 'plugins/**', 'scripts/**', 'tests/**', '*.json', '*.ts', '*.js', 'pnpm-lock.yaml', '.npmrc', 'codemagic.yaml', '.github/dependabot.yml', '.github/workflows/mobile.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.32.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Check Expo runtime compatibility
        env:
          EXPO_OFFLINE: '1'
        run: pnpm exec expo install --check
      - name: Dependency audit
        run: pnpm audit --audit-level moderate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Check bundled Android resource names
        run: |
          pnpm exec expo export --platform android --dump-assetmap --output-dir .data/android-resource-check
          node scripts/verify-android-assets.cjs .data/android-resource-check/assetmap.json
      - run: pnpm export
      - uses: actions/upload-artifact@v7
        with:
          name: mobile-javascript-bundles
          path: dist/
          retention-days: 7
